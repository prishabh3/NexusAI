version: "3.9"

name: nexusai

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nexusai-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      VECTOR_DB_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai
      STORAGE_PATH: /app/data
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - nexusai-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusai-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: nexusai-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - nexusai-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexusai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-net

  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-net

  ollama:
    image: ollama/ollama:latest
    container_name: nexusai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    networks:
      - nexusai-net

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nexusai-worker
    restart: unless-stopped
    command: python -m celery -A src.infrastructure.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      STORAGE_PATH: /app/data
    volumes:
      - ./apps/api:/app
      - nexusai-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusai-net

volumes:
  postgres-data:
  redis-data:
  ollama-models:
  nexusai-data:

networks:
  nexusai-net:
    driver: bridge
