name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234 or v1.2.3)"
        required: true
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -f infra/k8s/base/namespace.yaml
          kubectl apply -f infra/k8s/base/configmap.yaml
          kubectl apply -f infra/k8s/base/api-deployment.yaml
          kubectl apply -f infra/k8s/base/web-deployment.yaml

      - name: Update image tags
        run: |
          TAG=${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}
          TAG=${TAG:0:14}
          kubectl set image deployment/nexusai-api api=ghcr.io/${{ github.repository_owner }}/nexusai-api:${TAG} -n nexusai
          kubectl set image deployment/nexusai-web web=ghcr.io/${{ github.repository_owner }}/nexusai-web:${TAG} -n nexusai

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nexusai-api -n nexusai --timeout=300s
          kubectl rollout status deployment/nexusai-web -n nexusai --timeout=300s

      - name: Run DB migrations
        run: |
          kubectl exec -n nexusai deployment/nexusai-api -- alembic upgrade head

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy production
        run: |
          TAG=${{ github.event.inputs.image_tag || github.ref_name }}
          kubectl set image deployment/nexusai-api api=ghcr.io/${{ github.repository_owner }}/nexusai-api:${TAG} -n nexusai
          kubectl set image deployment/nexusai-web web=ghcr.io/${{ github.repository_owner }}/nexusai-web:${TAG} -n nexusai
          kubectl rollout status deployment/nexusai-api -n nexusai --timeout=300s
          kubectl rollout status deployment/nexusai-web -n nexusai --timeout=300s

      - name: Run DB migrations
        run: |
          kubectl exec -n nexusai deployment/nexusai-api -- alembic upgrade head
