name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -f infra/k8s/base/namespace.yaml
          kubectl apply -f infra/k8s/base/configmap.yaml
          kubectl apply -f infra/k8s/base/api-deployment.yaml
          kubectl apply -f infra/k8s/base/web-deployment.yaml

      - name: Update image tags
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          kubectl set image deployment/nexusai-api api=ghcr.io/${{ github.repository_owner }}/nexusai-api:sha-${SHA} -n nexusai
          kubectl set image deployment/nexusai-web web=ghcr.io/${{ github.repository_owner }}/nexusai-web:sha-${SHA} -n nexusai

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nexusai-api -n nexusai --timeout=300s
          kubectl rollout status deployment/nexusai-web -n nexusai --timeout=300s

      - name: Run DB migrations
        run: |
          kubectl exec -n nexusai deployment/nexusai-api -- alembic upgrade head

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy production
        run: |
          TAG=${{ github.ref_name }}
          kubectl set image deployment/nexusai-api api=ghcr.io/${{ github.repository_owner }}/nexusai-api:${TAG} -n nexusai
          kubectl set image deployment/nexusai-web web=ghcr.io/${{ github.repository_owner }}/nexusai-web:${TAG} -n nexusai
          kubectl rollout status deployment/nexusai-api -n nexusai --timeout=300s
