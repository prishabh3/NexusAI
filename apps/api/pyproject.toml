[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai-api"
version = "0.1.0"
description = "NexusAI — Autonomous AI Data Analyst API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # Settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # AI / LLM
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    # Analytics
    "duckdb>=1.1.3",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "numpy>=2.1.3",
    # ML
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.3",
    "shap>=0.46.0",
    # Forecasting (optional, graceful fallback)
    "prophet>=1.1.6",
    # Storage
    "aiofiles>=24.1.0",
    # Caching & background jobs
    "redis[hiredis]>=5.2.0",
    "celery[redis]>=5.4.0",
    # Logging
    "structlog>=24.4.0",
    # Observability
    "sentry-sdk[fastapi]>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.1",
    "types-aiofiles>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C90", "RUF"]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "N818",   # exception names don't need to end in Error
    "E501",   # line too long (100-char limit already enforced, some long strings are unavoidable)
    "N806",   # variable X in function should be lowercase (ML convention for feature matrix)
    "C901",   # function too complex (acceptable for ML/agent dispatch methods)
    "RUF046", # unnecessary int() cast around math.floor/ceil
    "N803",   # argument name X/X_train/X_test should be lowercase (ML convention)
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.infrastructure.ml.anomaly.detector",
    "src.infrastructure.ml.automl.pipeline",
    "src.infrastructure.ml.forecasting.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.infrastructure.ai.agents.coordinator"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]
