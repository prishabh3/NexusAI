apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-web
  namespace: nexusai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusai-web
  template:
    metadata:
      labels:
        app: nexusai-web
    spec:
      containers:
        - name: web
          image: nexusai/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: nexusai-config
                  key: api-url
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: nexusai-config
                  key: ws-url
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nexusai-web
  namespace: nexusai
spec:
  selector:
    app: nexusai-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusai-ingress
  namespace: nexusai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexusai.example.com
      secretName: nexusai-tls
  rules:
    - host: nexusai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexusai-api
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nexusai-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusai-web
                port:
                  number: 3000
