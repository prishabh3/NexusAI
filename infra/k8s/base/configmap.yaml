apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusai-config
  namespace: nexusai
data:
  api-url: "https://nexusai.example.com"
  ws-url: "wss://nexusai.example.com"
  ollama-base-url: "http://nexusai-ollama:11434"
  log-level: "INFO"
  agent-max-iterations: "15"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexusai-data-pvc
  namespace: nexusai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
