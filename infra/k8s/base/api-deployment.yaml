apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-api
  namespace: nexusai
  labels:
    app: nexusai-api
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexusai-api
    spec:
      serviceAccountName: nexusai-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: nexusai/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexusai-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nexusai-secrets
                  key: redis-url
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexusai-config
                  key: ollama-base-url
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusai-secrets
                  key: secret-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexusai-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nexusai-api
  namespace: nexusai
spec:
  selector:
    app: nexusai-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexusai-api
  namespace: nexusai
